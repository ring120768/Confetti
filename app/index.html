          <h1>Wedding Planner Pro — your AI wedding planner</h1>
          <p><strong>The wedding planner you didn't think you could afford.</strong> A professional wedding planner in the UK costs £3,000 or more. Wedding Planner Pro gives you the same job — a complete plan timed to your wedding date, plus Buzz, an AI planner who researches real venues and suppliers, chases what's late, and drafts your emails — free to start.</p>

          <h2>What it does</h2>
          <ul>
            <li><strong>Meet Buzz, your AI planner.</strong> Ask anything, any time. Buzz researches real venues and suppliers near you, checks their ratings, finds their contact details and drafts the enquiry email.</li>
            <li><strong>A plan that plans itself.</strong> Tell us your date and 140 expert UK wedding tasks schedule themselves around it — including the 29-day legal notice at the register office most couples miss.</li>
            <li><strong>Everything in one place.</strong> Guest list with RSVPs and dietary needs, a budget tracker with honest UK benchmarks, your supplier pipeline, an on-the-day running order, and your whole plan synced to your phone's calendar.</li>
          </ul>

          <h2>Pricing</h2>
          <p><strong>Free</strong> forever (full plan, 50 guests, budget and suppliers, a Buzz taster). <strong>Sparkle £8.99/month</strong> (unlimited everything, 200 Buzz messages). <strong>Luxe £18.99/month</strong> (unlimited Buzz and venue research, enquiry email drafting, day-of running order). Every paid plan has a 7-day free trial.</p>

          <h2>Available on</h2>
          <p>Any web browser, plus iPhone and Android apps. Try it at <a href="https://www.weddingplannerpro.co.uk/">weddingplannerpro.co.uk</a> or on <a href="https://play.google.com/store/apps/details?id=uk.co.weddingplannerpro.mobile">Google Play</a>.</p>

          <h2>Questions couples ask</h2>
          <h3>Is Wedding Planner Pro free?</h3>
          <p>Yes. The full task plan and timeline, a 50-guest list, budget and supplier tracking, and a Buzz taster are free forever. Paid plans add unlimited everything, each with a 7-day free trial.</p>
          <h3>What is Buzz?</h3>
          <p>Buzz is your AI wedding planner — she researches real venues and suppliers near you with ratings and contact details, and drafts your enquiry emails.</p>
          <h3>Does it work for UK weddings?</h3>
          <p>Yes — 140 expert tasks timed to your date, UK cost benchmarks, and reminders for legal steps like the 29-day register-office notice. Marrying abroad? The paperwork tasks adapt.</p>
          <h3>Can it replace a real wedding planner?</h3>
          <p>It does the planning, research, budgeting and on-the-day running order a planner does, for a fraction of the cost — and you can use it alongside a planner you hire.</p>
